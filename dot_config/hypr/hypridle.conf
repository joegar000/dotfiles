# Global hypridle behavior.
general {
    # Command used when something requests the session to be locked.
    #
    # `pidof hyprlock || hyprlock` means:
    # - if hyprlock is already running, do nothing
    # - otherwise, start hyprlock
    lock_cmd = pidof hyprlock || hyprlock

    # Run immediately before the machine goes to sleep.
    #
    # This ensures the session is locked before suspend,
    # so you don't wake back up into an unlocked desktop.
    before_sleep_cmd = loginctl lock-session

    # Turn the displays back on after waking from suspend.
    after_sleep_cmd = hyprctl dispatch dpms on
}


# ---------------------------------------------------------
# 4 minutes 30 seconds:
# warn that the screen is about to lock
# ---------------------------------------------------------
listener {
    # Timeout values are in seconds.
    timeout = 270

    # Sends a desktop notification.
    #
    # This assumes notify-send is installed.
    on-timeout = notify-send "Screen locking soon" "Your session will lock in 30 seconds."
}


# ---------------------------------------------------------
# 5 minutes:
# lock the session
# ---------------------------------------------------------
listener {
    timeout = 300

    # `loginctl lock-session` tells the session manager
    # that the session should lock.
    #
    # hypridle's lock_cmd above then launches hyprlock.
    on-timeout = loginctl lock-session
}


# ---------------------------------------------------------
# 10 minutes:
# turn the monitor off
# ---------------------------------------------------------
listener {
    timeout = 600

    # DPMS = Display Power Management Signaling.
    #
    # This tells Hyprland to power the display off.
    on-timeout = hyprctl dispatch dpms off

    # As soon as you move the mouse or press a key,
    # turn the display back on.
    on-resume = hyprctl dispatch dpms on
}


# ---------------------------------------------------------
# 30 minutes:
# suspend the computer
# ---------------------------------------------------------
listener {
    timeout = 1800

    # Suspend the whole machine using systemd.
    on-timeout = systemctl suspend
}
